<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 200px;
      padding: 10px;
      font-family: sans-serif;
      font-size: 14px;
    }

    .ebc-item {
      display: flex;
      align-items: center;
      margin: 6px 0;
    }

    .check {
      color: #07c4d9;
      margin-right: 8px;
      visibility: hidden;
    }

    .check.visible {
      visibility: visible;
    }
  </style>
</head>

<body>
  <div class="ebc-item">
    <span class="check" id="check-lan">✓</span>
    <span>ЭБС «Лань»</span>
  </div>
  <div class="ebc-item">
    <span class="check" id="check-urait">✓</span>
    <span>ЭБС «Юрайт»</span>
  </div>
  <div class="ebc-item">
    <span class="check" id="check-ibooks">✓</span>
    <span>ЭБС «Айбукс»</span>
  </div>
  <div id="status" style="margin-top: 10px; font-size: 12px; color: #666;">
    Проверка страницы...
  </div>

  <script src="popup.js"></script>
</body>

</html>
