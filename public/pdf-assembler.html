<!-- pdf-assembler.html -->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сборка PDF</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        #status {
            margin: 10px 0;
        }

        #progressBar {
            width: 100%;
            height: 20px;
            background-color: #f0f0f0;
            border-radius: 5px;
            overflow: hidden;
        }

        #progressBar div {
            height: 100%;
            background-color: #07c4d9;
            width: 0%;
            transition: width 0.3s;
        }

        /* Скрыть временный контейнер визуально, но оставить в DOM для html2canvas */
        #svg-render-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            /* Не мешает кликам по основной странице */
            z-index: -1;
            /* Позади всего */
            opacity: 0;
            /* Сделать невидимым */
        }
    </style>
</head>

<body>
    <h1>Собираем PDF файл</h1>
    <div id="status">Загрузка...</div>
    <div id="progressBar">
        <div></div>
    </div>
    <!-- Временный контейнер для рендеринга SVG с помощью html2canvas -->
    <div id="svg-render-container"></div>
    <script src="pdfAssembler.js"></script>
</body>

</html>
